[package]
name = "vwatch"
version = "0.2.0"
edition = "2021"
description = "Morning overview of all your agent-built software projects"
publish = false
default-run = "vWatch-UI"

[lib]
name = "vwatch"
path = "src/lib.rs"

[[bin]]
name = "vWatch"
path = "src/main.rs"

[[bin]]
name = "vWatch-UI"
path = "src/bin/vwatch-ui.rs"
required-features = ["desktop"]

[features]
default = ["desktop", "custom-protocol"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-single-instance", "dep:tauri-build"]
# Serve the embedded ui/ folder; without it Tauri expects a dev server.
custom-protocol = ["tauri?/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
sha1 = "0.10"
tokei = { version = "15.0.0", default-features = false }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ProcessSnapshotting",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Kernel",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

# Full debug info made target\ grow by tens of gigabytes on Windows (PDBs and
# rlibs). Line tables keep file:line in panics and backtraces; dependencies
# carry none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = true
codegen-units = 1
strip = true
