name: Bug report
description: Something in vWatch doesn't work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the project page of ...
        2. Click ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: vWatch version
      description: The output of `vwatch --version`.
      placeholder: "vwatch 0.2.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: input
    id: agent
    attributes:
      label: Coding agent
      description: Which agent operates vWatch, if the problem involves cards, briefs or the CLI.
      placeholder: Claude Code, Codex, vBot, ...
  - type: textarea
    id: output
    attributes:
      label: CLI output or error message
      description: Remove project names, paths or card text you don't want to share.
      render: text
