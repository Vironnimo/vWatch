[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lookout"
version = "0.1.0"
description = "Morning overview of all your agent-built projects"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
lookout = "lookout.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["lookout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
