<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lookout</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23e8870a'/%3E%3Cpath d='M9 18a7 7 0 0 1 14 0' stroke='%2315130f' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Look<span>out</span></h1><span class="date" id="date"></span></div>
    <div class="tools">
      <span class="fresh" id="fresh"></span>
      <button class="btn" id="refresh" type="button">Aktualisieren</button>
      <div class="switch" role="group" aria-label="Darstellung">
        <button data-style="handover" aria-pressed="true" type="button">Übergabe</button>
        <button data-style="board" aria-pressed="false" type="button">Leitstand</button>
      </div>
    </div>
  </header>
  <main id="view"><p class="muted" style="margin-top:40px">Lade …</p></main>
  <footer id="foot" class="foot"></footer>
</div>
<div id="drawer-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
